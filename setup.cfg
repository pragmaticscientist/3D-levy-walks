[metadata]
name = ltdb-levy
version = 0.1.0
description = Fit Levy-walk surrogates to LTDB trajectories and compare search performance

[options]
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.20
    scipy>=1.6
    pandas>=1.2
    matplotlib>=3.3
    pyyaml>=5.3

[options.packages.find]
include =
    ltdb_levy*

[options.extras_require]
test =
    pytest>=6.0

[options.entry_points]
console_scripts =
    ltdb-levy = ltdb_levy.cli:main
