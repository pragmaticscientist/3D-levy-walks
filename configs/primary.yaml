schema_version: 1
run_id: primary

input:
  tracks_directory: ../datasets/GT_TRACKS
  glob: "*GT*.csv"
  metadata_file: ltdb_metadata.csv
  coordinates_are_physical: true

selection:
  include_files: []
  exclude_files:
    - SQUARE_GT..csv
  minimum_observations_per_track: 6

preprocessing:
  split_at_missing_frames: true
  duplicate_policy: error
  interpolation: false

segmentation:
  method: angle_speed
  # Literature anchor: Georgantzoglou et al. (J Cell Biol, 2022,
  # doi:10.1083/jcb.202103207) classify 90--180-degree changes as large
  # U-turns. This is an operational anchor, not a universal biological
  # constant; 45 and 60 degrees remain prespecified sensitivities.
  turning_angle_degrees: 90.0
  speed_threshold: null
  speed_threshold_units: um_per_second
  alternative_turning_angles: [45.0, 60.0, 90.0]
  # Leukocyte arrest is commonly defined below 2 um/min (= 0.03333 um/s).
  # Half and double that value bracket the literature threshold. These are
  # speed sensitivities; the primary fit does not impose a speed cutoff.
  alternative_speed_thresholds: [null, 0.0166666667, 0.0333333333, 0.0666666667]
  exclude_first_and_last_run: true
  minimum_run_frames: 1
  minimum_run_length: 0.0

conditions:
  grouping_fields: [cell_type, organ, stimulus, dt_seconds]
  fallback_to_file: true
  require_verified_metadata: true

empirical_pool:
  primary_weighting: cell_balanced
  alternative_weightings: [step_weighted]
  use_complete_runs_only: true
  minimum_tracks_per_pool: 15
  minimum_runs_per_pool: 100
  optional_block_lengths: [3, 5]
  sample_length_duration_jointly: false

fitting:
  lmax_method: empirical_max
  user_lmax: null
  lmax_quantile: 0.99
  # One dimensionless length unit is half the 7.5 um reference leukocyte
  # diameter. It is now only the optimizer start and biological reference:
  # one crossover is estimated independently for every eligible condition.
  crossover: 3.75
  estimate_crossover: true
  # Null selects numerical/data limits: 0.1 times the smallest positive run up
  # to just below that condition's empirical lmax. Boundary fits are flagged.
  crossover_bounds: null
  # Factor-of-two sensitivity around the radius scale, extended to one quarter
  # and four radii (half and twice the reference cell diameter).
  crossover_sensitivity: [0.9375, 1.875, 3.75, 7.5, 15.0]
  mu_bounds: [1.001, 10.0]
  goodness_of_fit_bootstraps: 500
  # The 12-cell segmentation grid uses fewer refits than the eight primary
  # condition fits; its purpose is robustness screening, not headline p-values.
  segmentation_goodness_of_fit_bootstraps: 100
  clustered_bootstraps: 1000
  cv_folds: 10
  random_seed: 12345

replay:
  domain_side_length: 512.0
  detection_radius: 1.0
  shapes: [Ball, Disk, Line]
  projected_areas: [64.0, 256.0, 1024.0, 4096.0, 16384.0]
  replays_per_track_target: 200
  budget_type: path_length
  fixed_budget_quantile: 0.5
  overshoot_policy: discard
  check_initial_position: false
  block_lengths: [3, 5]
  pilot_tracks_per_condition: 2
  pilot_replays_per_track: 10
  pilot_min_detected: 20
  pilot_min_undetected: 20
  random_seed: 12345

output:
  root: ../outputs/primary
  figures: true
