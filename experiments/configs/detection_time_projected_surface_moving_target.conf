#=============================
# Simulation configuration
#=============================

# surface_selector=2 interprets range_diam as projected surface area.
# moving_target=1 gives the target a continuous isotropic random walk at unit
# speed, with straight runs of target_step_length carried across searcher steps.
surface_selector=2
moving_target=1
target_step_length=1.0
delta_selector=0
steps_between=0
max_touches=1
num_runs=2000
num_threads=50

rangemu_LevyDistrib=1.0,1.2,1.4,1.6,1.8,2.0,2.2,2.4,2.6,2.8,3.0
# Line is admissible through 1000; larger values are retained for Ball and Disk
# and are skipped automatically for Line by the D <= side guard.
range_diam=64,96,128,256,512,1000,2048,4096,8000,16000,32000,64000,128000,200000
range_side=512
l_max=256
range_delta=0.0

list_shapes=Ball,Line,Disk

range_nwalkers=1
range_ntargets=1
range_probability=1.0

save_directory=./results/detection_time_fixed_vs_moving_projected_surface/moving/
file_name=detection_time_projected_surface_moving_target.csv
